server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_types text/html text/css application/javascript application/json;

  location / {
    try_files $uri $uri/ =404;
  }

  # Gzip for all text-based assets
  location ~* \.(html|css|js|json|svg|png|jpg|webp)$ {
    gzip_static on;
  }
}
